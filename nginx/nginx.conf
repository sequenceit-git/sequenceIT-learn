upstream skylearn_app {
    server web:8000;
}

# ============================================================
# HTTP — Redirect to HTTPS (enable after Certbot setup)
# ============================================================
# Uncomment this block and the HTTPS block below after running Certbot
# server {
#     listen 80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ============================================================
# HTTP Server (used until SSL is configured)
# ============================================================
server {
    listen 80;
    server_name _;   # Accepts any hostname; replace with your domain

    client_max_body_size 50M;

    # Logging
    access_log /var/log/nginx/skylearn_access.log;
    error_log  /var/log/nginx/skylearn_error.log;

    # ----------------------------------------------------------
    # Static files — served directly by Nginx (fast, no Django)
    # ----------------------------------------------------------
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ----------------------------------------------------------
    # Media files — served directly by Nginx
    # ----------------------------------------------------------
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ----------------------------------------------------------
    # Proxy all other requests to Gunicorn (Django)
    # ----------------------------------------------------------
    location / {
        proxy_pass         http://skylearn_app;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_redirect     off;

        proxy_connect_timeout 60s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}

