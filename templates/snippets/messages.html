
{% if messages %}
    {% for message in messages %}
        {% if message.tags == 'error' %}
            <div class="alert py-2 alert-danger d-flex align-items-center">
                <i data-lucide="alert-circle" class="me-2" style="flex-shrink: 0;"></i><span>{{ message }}</span>
            </div>
        {% elif message.tags == 'warning' %}
            <div class="alert py-2 alert-warning d-flex align-items-center">
                <i data-lucide="alert-triangle" class="me-2" style="flex-shrink: 0;"></i><span>{{ message }}</span>
            </div>
        {% else %}
            <div class="alert py-2 alert-success d-flex align-items-center">
                <i data-lucide="check-circle" class="me-2" style="flex-shrink: 0;"></i><span>{{ message }}</span>
            </div>
        {% endif %}
    {% endfor %}
{% endif %}
