version: "3.9"

# ============================================================
# SequenceIT Learn — Production Docker Compose Stack
# Routing: Traefik (already running on host) → sms-demo.sequenceit.com
# Services: web (Django/Gunicorn) | db (PostgreSQL)
# ============================================================

services:

  # ----------------------------------------------------------
  # PostgreSQL Database
  # ----------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: sequenceit_db
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME:-sequenceit}
      POSTGRES_USER: ${DB_USER:-sequenceit}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sequenceit} -d ${DB_NAME:-sequenceit}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sequenceit_network   # internal only — DB never exposed to Traefik

  # ----------------------------------------------------------
  # Django Application (Gunicorn)
  # Traefik picks this up via labels and routes
  # sms-demo.sequenceit.com → this container on port 8000
  # ----------------------------------------------------------
  web:
    image: ${DOCKER_IMAGE:-sequenceit-web}:latest
    container_name: sequenceit_web
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120 --access-logfile - --error-logfile -
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
    env_file:
      - .env
    environment:
      - DEBUG=False
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-sequenceit}
      - DB_USER=${DB_USER:-sequenceit}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sequenceit_network   # internal network (talks to db)
      - traefik            # Traefik's external network (for routing)
    expose:
      - "8000"
    labels:
      # ---- Enable Traefik for this container ----
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"

      # ---- HTTPS Router (primary) ----
      - "traefik.http.routers.sequenceit.rule=Host(`sms-demo.sequenceit.com`)"
      - "traefik.http.routers.sequenceit.entrypoints=websecure"
      - "traefik.http.routers.sequenceit.tls=true"
      - "traefik.http.routers.sequenceit.tls.certresolver=letsencrypt"

      # ---- HTTP Router (redirect HTTP → HTTPS) ----
      - "traefik.http.routers.sequenceit-http.rule=Host(`sms-demo.sequenceit.com`)"
      - "traefik.http.routers.sequenceit-http.entrypoints=web"
      - "traefik.http.routers.sequenceit-http.middlewares=redirect-to-https"

      # ---- Middleware: HTTP → HTTPS redirect ----
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

      # ---- Service: point to Gunicorn port ----
      - "traefik.http.services.sequenceit.loadbalancer.server.port=8000"


# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:
    driver: local
  media_files:
    driver: local
  static_files:
    driver: local


# ============================================================
# Networks
# ============================================================
networks:
  sequenceit_network:
    driver: bridge          # internal DB ↔ app communication

  traefik:
    external: true          # must already exist on the host (created by your Traefik setup)
